name: Pakete aktualisieren

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pkg: [faugus-launcher, proton-ge, proton-cachyos, proton-em, proton-kron4ek]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Neue Version holen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INFO_FILE: ${{ runner.temp }}/info.md
        run: scripts/update.sh "${{ matrix.pkg }}"

      - name: Änderungen prüfen
        id: check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bauen
        if: steps.check.outputs.changed == 'true'
        run: nix build ".#${{ matrix.pkg }}" --no-link -L

      - name: Pull-Request öffnen
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update/${{ matrix.pkg }}
          title: "${{ matrix.pkg }}: neue Version"
          commit-message: "${{ matrix.pkg }}: neue Version"
          body-path: ${{ runner.temp }}/info.md
          delete-branch: true
