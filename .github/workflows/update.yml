name: Update packages

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pkg: [faugus-launcher, proton-ge, proton-cachyos, proton-em, proton-kron4ek]
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - name: Fetch new version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INFO_FILE: ${{ runner.temp }}/info.md
        run: scripts/update.sh "${{ matrix.pkg }}"

      - name: Check for changes
        id: check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.changed == 'true'
        run: nix build ".#${{ matrix.pkg }}" --no-link -L

      - name: Open pull request
        id: cpr
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update/${{ matrix.pkg }}
          title: "${{ matrix.pkg }}: new version"
          commit-message: "${{ matrix.pkg }}: new version"
          body-path: ${{ runner.temp }}/info.md
          delete-branch: true

      - name: Merge pull request (build above passed)
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --squash --delete-branch --repo "${{ github.repository }}"
